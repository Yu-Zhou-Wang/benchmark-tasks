<svg xmlns="http://www.w3.org/2000/svg" width="1060" height="640" viewBox="0 0 1060 640" role="img" aria-labelledby="title desc">
<title id="title">Unheated turntable fixture assembly drawing</title>
<desc id="desc">Plan, drive pin and socket pattern, section through the spindle and roller, and cabinet elevation. All dimensions are in millimetres and heights refer to the floor surface.</desc>
