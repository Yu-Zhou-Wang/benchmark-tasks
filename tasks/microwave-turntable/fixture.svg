.deck{fill:#e0e7e8;stroke:#273f50}.tray{stroke:#2367a7;fill:#d5eef6;fill-opacity:.6}.ring{stroke:#a33e80;fill:none}.pin{fill:#b9771d;stroke:#704b1c}
</style>
